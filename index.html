<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <script>
      try {
        const language = localStorage.getItem("joo-language");
        const theme = localStorage.getItem("joo-theme");
        if (language === "en" || language === "ko") document.documentElement.lang = language;
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        } else if (matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.dataset.theme = "dark";
        }
      } catch {}
    </script>
    <link rel="icon" href="/images/favicon.gif" />
    <title>Hey, Joo — Product builder</title>
    <meta
      name="description"
      content="Product builder designing AI/ML, developer experience, and tech infrastructure products since 2012."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
